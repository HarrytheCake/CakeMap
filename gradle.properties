# Cake multiloader kit: one build for every Minecraft version (<mc>/version.properties) and loader.
# Run Gradle with JDK 25: JAVA_HOME="C:/Program Files/Java/jdk-25.0.4" ./gradlew build
# Only some versions: ./gradlew build -Pcake.versions=1.20.4
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
# idle daemons give their memory back after 15 minutes (several builds run on this machine at once)
org.gradle.daemon.idletimeout=900000
org.gradle.parallel=false
org.gradle.caching=true

mod_id=cakemap
mod_name=CakeMap
mod_version=0.1.0
mod_group=io.github.harrythecake

# the CakeUI release CakeMap compiles against and runs with in dev (needs addHudPiece, API version 2):
# its GitHub release jars cakeui-<loader>-<mc>-<version>.jar. -Pcakeui_dir=../cakeui/build/libs uses a local
# multiloader build of CakeUI instead (unreleased CakeUI changes).
cakeui_version=0.2.0
# SVG icons (MIT, bundled: include on Fabric, jarJar on NeoForge)
jsvg_version=2.2.0
